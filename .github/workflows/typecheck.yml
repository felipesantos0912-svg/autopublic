---
name: "Typecheck e testes (agente-dm)"

# Checagem rápida (cerca de 6 a 8 min), bem mais curta que o build completo da imagem:
# compila só os tipos do orquestrador e do backend e roda os testes do atendente de DM.
# Roda ao enviar commits para a branch agente-dm ou manualmente.

on:
  workflow_dispatch:
  push:
    branches:
      - 'agente-dm'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tipos do orquestrador
        run: pnpm exec tsc -p apps/orchestrator/tsconfig.json --noEmit

      - name: Tipos do backend
        run: pnpm exec tsc -p apps/backend/tsconfig.json --noEmit

      - name: Testes do atendente de DM
        run: pnpm exec jest --selectProjects nestjs-libraries --testPathPattern 'dm-agent' --passWithNoTests
