---
name: "Typecheck e testes (agente-dm)"

# Checagem rápida (cerca de 6 a 8 min), bem mais curta que o build completo da imagem:
# confere os tipos do orquestrador e do backend e roda os testes do atendente de DM.
# O projeto original já tem alguns erros de tipo que o build dele tolera, então o
# passo de tipos só FALHA por erro nos arquivos que o atendente altera; os demais
# aparecem no log como informação.
# Roda ao enviar commits para a branch agente-dm ou manualmente.

on:
  workflow_dispatch:
  push:
    branches:
      - 'agente-dm'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tipos (orquestrador e backend)
        run: |
          set +e
          pnpm exec tsc -p apps/orchestrator/tsconfig.json --noEmit > tsc-orq.txt 2>&1
          pnpm exec tsc -p apps/backend/tsconfig.json --noEmit > tsc-back.txt 2>&1
          cat tsc-orq.txt tsc-back.txt | grep 'error TS' | sort -u > tsc-all.txt
          echo "Erros de tipo no total (inclui os que já existem no projeto original): $(wc -l < tsc-all.txt)"
          echo "--- todos os erros ---"
          cat tsc-all.txt
          grep -E "dm-agent/|flows\.service\.ts|flow\.activity\.ts|flow\.execution\.workflow\.ts|ig-webhook\.controller\.ts|flow\.dto\.ts|database\.module\.ts|instagram-messaging\.service\.ts" tsc-all.txt > tsc-mine.txt
          echo "--- erros nos arquivos do atendente (devem ser 0) ---"
          cat tsc-mine.txt
          test ! -s tsc-mine.txt

      - name: Testes do atendente de DM e das automações (os que já existiam também)
        run: pnpm exec jest --selectProjects nestjs-libraries --testPathPattern 'dm-agent|prisma/flows' --passWithNoTests
